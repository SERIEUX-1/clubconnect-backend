name: ClubConnect CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DJANGO_SECRET_KEY: ci-not-for-production
      DEBUG: "True"
      DATABASE_URL: sqlite:////tmp/clubconnect-ci.sqlite3
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      NOTIFICATION_CHANNELS: in_app,email
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install Django==5.0.6 djangorestframework djangorestframework_simplejwt django-cors-headers django-environ django-filter dj-database-url factory_boy pytest pytest-django psycopg2-binary pillow gunicorn whitenoise
      - name: Check
        run: python manage.py check
      - name: Tests
        run: python -m pytest -q --tb=short
